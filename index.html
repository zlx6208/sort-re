<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer 首頁</title>

<style>
body{
    margin:0;
    font-family:Microsoft JhengHei;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* 主卡片 */
.container{
    width:90%;
    max-width:600px;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
    color:#333;
}

.subtitle{
    color:#666;
    margin-bottom:20px;
}

/* 按鈕區 */
.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* 排序按鈕 */
a{
    display:block;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    color:white;
    transition:0.3s;
}

/* 每個排序不同顏色 */
.bubble{background:#2196F3;}
.selection{background:#9C27B0;}
.insertion{background:#FF9800;}
.merge{background:#4CAF50;}
.quick{background:#f44336;}

/* hover 效果 */
a:hover{
    transform:scale(1.05);
    filter:brightness(1.1);
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#888;
}
</style>

</head>

<body>

<div class="container">

<h1>Sorting Visualizer</h1>
<div class="subtitle">排序演算法視覺化系統</div>

<div class="menu">

<a class="bubble" href="bubble-sort.html">🫧 Bubble Sort 氣泡排序</a>
<a class="selection" href="selection-sort.html">🔷 Selection Sort 選擇排序</a>
<a class="insertion" href="insertion-sort.html">🔶 Insertion Sort 插入排序</a>
<a class="merge" href="merge-sort.html">📦 Merge Sort 合併排序</a>
<a class="quick" href="quick-sort.html">⚡ Quick Sort 快速排序</a>

</div>

<div class="footer">
Made for Sorting Algorithm Visualization Project
</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bubble Sort Demo</title>

<style>
body{
    font-family: Arial;
    text-align: center;
}

#container{
    margin-top:40px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    height:300px;
}

.bar{
    width:30px;
    margin:3px;
    background-color:steelblue;
}
</style>

</head>

<body>

<h2>Bubble Sort Animation</h2>

<button onclick="startSort()">開始排序</button>

<div id="container"></div>

<script>

let arr = [];
let container = document.getElementById("container");

function createBars(){

    container.innerHTML="";
    arr=[];

    for(let i=0;i<20;i++){
        let value=Math.floor(Math.random()*200)+20;
        arr.push(value);

        let bar=document.createElement("div");
        bar.classList.add("bar");
        bar.style.height=value+"px";

        container.appendChild(bar);
    }
}

async function bubbleSort(){

    let bars=document.getElementsByClassName("bar");

    for(let i=0;i<arr.length;i++){

        for(let j=0;j<arr.length-i-1;j++){

            bars[j].style.background="red";
            bars[j+1].style.background="red";

            await new Promise(r=>setTimeout(r,100));

            if(arr[j] > arr[j+1]){

                let temp=arr[j];
                arr[j]=arr[j+1];
                arr[j+1]=temp;

                bars[j].style.height=arr[j]+"px";
                bars[j+1].style.height=arr[j+1]+"px";
            }

            bars[j].style.background="steelblue";
            bars[j+1].style.background="steelblue";
        }
    }
}

function startSort(){
    bubbleSort();
}

createBars();

</script>

</body>
</html>

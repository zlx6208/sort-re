<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣泡排序法視覺化</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:'Microsoft JhengHei',Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:25px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

input,button{
    padding:10px;
    border:none;
    border-radius:10px;
    font-size:14px;
}

button{
    cursor:pointer;
    background:#2196F3;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:0.85;
}

#canvas{
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
    border-radius:5px 5px 0 0;
    transition: all 0.3s ease;
}

.bar.comparing{ background:orange; }
.bar.swapping{ background:red; }
.bar.sorted{ background:green; }

/* 圖例 */
.legend{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
    font-size:14px;
}

.box{
    width:15px;
    height:15px;
    display:inline-block;
    margin-right:5px;
    border-radius:3px;
}

.blue{ background:#2196F3; }
.orange{ background:orange; }
.red{ background:red; }
.green{ background:green; }

</style>
</head>

<body>

<div class="container">

<h1>氣泡排序法視覺化</h1>

<div class="controls">

<button onclick="goBack()">⬅️ 返回</button>

<input id="numInput" type="number" placeholder="組數(預設8)" min="3" max="50">

<button onclick="generateArray()">產生數列</button>
<button onclick="startSort()">開始排序</button>
<button onclick="pauseSort()">暫停 / 繼續</button>
<button onclick="resetSort()">重置</button>

<label>速度</label>
<input type="range" id="speed" min="50" max="1000" value="400">

</div>

<div id="canvas"></div>

<div class="legend">
    <div><span class="box blue"></span>未排序</div>
    <div><span class="box orange"></span>比較中</div>
    <div><span class="box red"></span>交換中</div>
    <div><span class="box green"></span>已排序</div>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");

let array = [];
let n = 8;
let isSorting = false;
let isPaused = false;
let speed = 400;

// 返回
function goBack(){
    if(confirm("確定要返回上一頁嗎？")){
        window.history.back();
    }
}

// 取得組數
function getN(){
    let val = parseInt(document.getElementById("numInput").value);
    return (isNaN(val) || val < 3) ? 8 : val;
}

// 速度控制
document.getElementById("speed").oninput = (e)=>{
    speed = parseInt(e.target.value);
};

// 產生數列
function generateArray(){
    n = getN();
    array = [];

    for(let i=0;i<n;i++){
        array.push(Math.floor(Math.random()*300)+20);
    }

    draw();
}

// 畫圖
function draw(){
    canvas.innerHTML = "";

    const barWidth = canvas.clientWidth / n;

    array.forEach((v,i)=>{
        const bar = document.createElement("div");
        bar.className = "bar";

        bar.style.left = (i * barWidth) + "px";
        bar.style.width = Math.max(barWidth * 0.6, 5) + "px";

        const height = (v / 320) * 380;
        bar.style.height = height + "px";

        bar.textContent = v;

        canvas.appendChild(bar);
    });
}

// sleep
function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

// Bubble Sort
async function bubbleSort(){
    let bars = document.getElementsByClassName("bar");

    for(let i=0;i<n-1;i++){
        for(let j=0;j<n-i-1;j++){

            while(isPaused) await sleep(100);

            bars[j].classList.add("comparing");
            bars[j+1].classList.add("comparing");

            await sleep(speed);

            if(array[j] > array[j+1]){

                [array[j],array[j+1]] = [array[j+1],array[j]];

                draw();
                bars = document.getElementsByClassName("bar");

                bars[j].classList.add("swapping");
                bars[j+1].classList.add("swapping");

                await sleep(speed);
            }

            bars[j].classList.remove("comparing","swapping");
            bars[j+1].classList.remove("comparing","swapping");
        }

        bars[n-i-1].classList.add("sorted");
    }

    isSorting = false;
}

// 控制
function startSort(){
    if(isSorting) return;
    isSorting = true;
    bubbleSort();
}

function pauseSort(){
    isPaused = !isPaused;
}

function resetSort(){
    isSorting = false;
    isPaused = false;
    generateArray();
}

// 初始化
generateArray();

</script>

</body>
</html>

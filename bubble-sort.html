<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣泡排序法視覺化</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Microsoft JhengHei', Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 30px;
}

h1 { text-align:center; margin-bottom:10px; }

.controls {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
}

input, button {
    padding:10px;
    border-radius:10px;
    border:none;
    font-size:14px;
}

button {
    cursor:pointer;
    font-weight:bold;
}

.btn { background:#2196F3; color:white; }
.btn:hover { opacity:0.8; }

#canvas {
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;
}

.bar {
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:14px;
    font-weight:bold;
    border-radius:5px 5px 0 0;
    transition: all 0.4s ease;
}

.bar.comparing { background: orange; }
.bar.swapping { background: red; }
.bar.sorted { background: green; }

</style>
</head>

<body>

<div class="container">

<h1>氣泡排序法視覺化</h1>

<div class="controls">

<input id="numInput" type="number" placeholder="組數 (預設8)" min="3" max="50">

<button class="btn" onclick="generateArray()">產生數列</button>
<button class="btn" onclick="startSort()">開始排序</button>
<button class="btn" onclick="pauseSort()">暫停/繼續</button>
<button class="btn" onclick="resetSort()">重置</button>

<label>速度</label>
<input type="range" id="speed" min="50" max="1000" value="400">

</div>

<div id="canvas"></div>

</div>

<script>
const canvas = document.getElementById("canvas");

let array = [];
let n = 8;
let isSorting = false;
let isPaused = false;

let speed = 400;

// 👉 取得組數
function getN(){
    let val = parseInt(document.getElementById("numInput").value);
    return (isNaN(val) || val < 3) ? 8 : val;
}

// 👉 速度控制
document.getElementById("speed").oninput = (e)=>{
    speed = parseInt(e.target.value);
};

// 👉 產生數列
function generateArray(){
    n = getN();
    array = [];

    for(let i=0;i<n;i++){
        array.push(Math.floor(Math.random()*300)+20);
    }

    draw();
}

// 👉 畫圖（核心：自動調整寬度）
function draw(){
    canvas.innerHTML = "";

    const barWidth = canvas.clientWidth / n;

    array.forEach((v,i)=>{
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.left = (i * barWidth) + "px";
        bar.style.width = (barWidth * 0.9) + "px";

        const h = (v / 320) * 380;
        bar.style.height = h + "px";

        bar.textContent = v;

        canvas.appendChild(bar);
    });
}

// 👉 sleep（動畫速度）
function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

// 👉 Bubble Sort
async function bubbleSort(){
    let bars = document.getElementsByClassName("bar");

    for(let i=0;i<n-1;i++){
        for(let j=0;j<n-i-1;j++){

            while(isPaused) await sleep(100);

            bars[j].classList.add("comparing");
            bars[j+1].classList.add("comparing");

            await sleep(speed);

            if(array[j] > array[j+1]){

                [array[j],array[j+1]] = [array[j+1],array[j]];

                draw();
                bars = document.getElementsByClassName("bar");

                bars[j].classList.add("swapping");
                bars[j+1].classList.add("swapping");

                await sleep(speed);
            }

            bars[j].classList.remove("comparing","swapping");
            bars[j+1].classList.remove("comparing","swapping");
        }

        bars[n-i-1].classList.add("sorted");
    }

    isSorting = false;
}

// 👉 控制
function startSort(){
    if(isSorting) return;
    isSorting = true;
    bubbleSort();
}

function pauseSort(){
    isPaused = !isPaused;
}

function resetSort(){
    isSorting = false;
    isPaused = false;
    generateArray();
}

// init
generateArray();

</script>

</body>
</html>

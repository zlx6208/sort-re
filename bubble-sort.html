<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣泡排序法視覺化</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"Microsoft JhengHei";
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:25px;
}

h1{text-align:center;margin-bottom:15px;}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border-radius:10px;
    border:none;
    font-size:14px;
}

button{
    background:#2196F3;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#canvas{
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;
    padding:0 20px;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
    border-radius:6px 6px 0 0;
    transition:all 0.3s ease;
}

.bar.comparing{background:orange;}
.bar.swapping{background:red;}
.bar.sortedAll{background:#4CAF50 !important;}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
    font-size:14px;
    flex-wrap:wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>氣泡排序法視覺化</h1>

<div class="controls">

<button onclick="goBack()">⬅️ 返回首頁</button>

<input id="numInput" type="number" placeholder="組數(預設8)" min="3" max="50">

<button onclick="generateArray()">產生數列</button>
<button onclick="startSort()">開始排序</button>
<button onclick="pauseSort()">暫停/繼續</button>
<button onclick="resetSort()">重置</button>

</div>

<div id="canvas"></div>

<div class="stats">
    <div>比較：<span id="cmp">0</span></div>
    <div>交換：<span id="swp">0</span></div>
    <div>移動：<span id="mov">0</span></div>
    <div>時間複雜度：O(n²)</div>
    <div>空間複雜度：O(1)</div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");

let array=[];
let n=8;

let isSorting=false;
let isPaused=false;

let cmp=0,swp=0,mov=0;

function goBack(){
    if(confirm("確定返回上一頁？")) window.history.back();
}

function getN(){
    let v=parseInt(document.getElementById("numInput").value);
    return (isNaN(v)||v<3)?8:v;
}

function generateArray(){
    n=getN();
    array=[];
    for(let i=0;i<n;i++){
        array.push(Math.floor(Math.random()*300)+20);
    }
    draw();
}

function draw(){
    canvas.innerHTML="";
    const w=(canvas.clientWidth-40)/n;

    array.forEach((v,i)=>{
        const bar=document.createElement("div");
        bar.className="bar";

        bar.style.left=(20+i*w+w*0.2)+"px";
        bar.style.width=w*0.6+"px";
        bar.style.height=(v/320)*380+"px";
        bar.textContent=v;

        canvas.appendChild(bar);
    });
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function update(){
    document.getElementById("cmp").textContent=cmp;
    document.getElementById("swp").textContent=swp;
    document.getElementById("mov").textContent=mov;
}

function finish(){
    let bars=document.getElementsByClassName("bar");
    for(let b of bars){
        b.className="bar sortedAll";
    }
}

async function bubbleSort(){

    let bars=document.getElementsByClassName("bar");

    for(let i=0;i<n-1;i++){
        for(let j=0;j<n-i-1;j++){

            while(isPaused) await sleep(100);

            cmp++;
            update();

            bars[j].classList.add("comparing");
            bars[j+1].classList.add("comparing");

            await sleep(300);

            if(array[j]>array[j+1]){

                [array[j],array[j+1]]=[array[j+1],array[j]];
                swp++;
                mov++;

                draw();
                bars=document.getElementsByClassName("bar");

                bars[j].classList.add("swapping");

                await sleep(300);
            }

            bars[j].classList.remove("comparing","swapping");
            bars[j+1].classList.remove("comparing","swapping");
        }

        bars[n-i-1].classList.add("sortedAll");
    }

    finish();
    isSorting=false;
}

function startSort(){
    if(isSorting) return;

    isSorting=true;

    cmp=swp=mov=0;
    update();

    bubbleSort();
}

function pauseSort(){
    isPaused=!isPaused;
}

function resetSort(){
    isSorting=false;
    isPaused=false;

    cmp=swp=mov=0;
    update();

    generateArray();
}

generateArray();

</script>

</body>
</html>

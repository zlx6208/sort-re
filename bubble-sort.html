<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣泡排序法視覺化</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"Microsoft JhengHei";
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:25px;
}

h1{text-align:center;margin-bottom:15px;}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border-radius:10px;
    border:none;
    font-size:14px;
}

button{
    background:#2196F3;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#canvas{
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;

    /* ✅ 左右留白（你要的1公分效果） */
    padding:0 20px;
    box-sizing:border-box;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
    border-radius:6px 6px 0 0;
    transition:all 0.3s ease;
}

.bar.comparing{background:orange;}
.bar.swapping{background:red;}
.bar.sorted{background:green;}

.stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:10px;
    font-size:16px;
}

</style>
</head>

<body>

<div class="container">

<h1>氣泡排序法視覺化</h1>

<div class="controls">

<input id="numInput" type="number" placeholder="組數(預設8)" min="3" max="50">

<button onclick="generateArray()">產生數列</button>
<button onclick="startSort()">開始排序</button>
<button onclick="pauseSort()">暫停</button>
<button onclick="resetSort()">重置</button>

</div>

<div id="canvas"></div>

<div class="stats">
    <div>比較次數：<span id="cmp">0</span></div>
    <div>交換次數：<span id="swp">0</span></div>
    <div>移動次數：<span id="mov">0</span></div>
</div>

</div>

<script>

const canvas = document.getElementById("canvas");

let array=[];
let n=8;

let isSorting=false;
let isPaused=false;

let cmp=0, swp=0, mov=0;

// 取得 n
function getN(){
    let v=parseInt(document.getElementById("numInput").value);
    return (isNaN(v)||v<3)?8:v;
}

// 產生數列
function generateArray(){
    n=getN();
    array=[];

    for(let i=0;i<n;i++){
        array.push(Math.floor(Math.random()*300)+20);
    }

    draw();
}

// 畫圖（✔置中核心在這）
function draw(){
    canvas.innerHTML="";

    const usableWidth = canvas.clientWidth - 40; // 留白後可用空間
    const barWidth = usableWidth / n;

    array.forEach((v,i)=>{
        const bar=document.createElement("div");
        bar.className="bar";

        // ✅ 每格置中
        const x = 20 + i*barWidth + (barWidth*0.2);

        bar.style.left = x + "px";

        // ✅ 比格子更窄 → 視覺置中
        bar.style.width = (barWidth*0.6) + "px";

        const h=(v/320)*380;
        bar.style.height=h+"px";

        bar.textContent=v;

        canvas.appendChild(bar);
    });
}

// sleep
function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

// 更新統計
function update(){
    document.getElementById("cmp").textContent=cmp;
    document.getElementById("swp").textContent=swp;
    document.getElementById("mov").textContent=mov;
}

// bubble sort
async function bubbleSort(){

    let bars=document.getElementsByClassName("bar");

    for(let i=0;i<n-1;i++){
        for(let j=0;j<n-i-1;j++){

            while(isPaused) await sleep(100);

            cmp++;
            update();

            bars[j].classList.add("comparing");
            bars[j+1].classList.add("comparing");

            await sleep(300);

            if(array[j]>array[j+1]){

                [array[j],array[j+1]]=[array[j+1],array[j]];
                swp++;
                mov++; // ✅ 每次交換 = 移動

                update();
                draw();

                bars=document.getElementsByClassName("bar");

                bars[j].classList.add("swapping");
                bars[j+1].classList.add("swapping");

                await sleep(300);
            }

            bars[j].classList.remove("comparing","swapping");
            bars[j+1].classList.remove("comparing","swapping");
        }

        bars[n-i-1].classList.add("sorted");
    }

    isSorting=false;
}

// 控制
function startSort(){
    if(isSorting) return;
    isSorting=true;
    bubbleSort();
}

function pauseSort(){
    isPaused=!isPaused;
}

function resetSort(){
    isSorting=false;
    isPaused=false;
    cmp=swp=mov=0;
    update();
    generateArray();
}

// init
generateArray();

</script>

</body>
</html>

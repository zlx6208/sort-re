<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速排序法</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"Microsoft JhengHei";
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:25px;
}

h1{text-align:center;margin-bottom:10px;}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border:none;
    border-radius:10px;
    font-size:14px;
}

button{
    background:#2196F3;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#canvas{
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;
    padding:0 20px;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
    border-radius:6px 6px 0 0;
    transition:all 0.3s ease;
}

.bar.pivot{background:purple;}
.bar.comparing{background:orange;}
.bar.sortedAll{background:#4CAF50 !important;}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
    flex-wrap:wrap;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>快速排序法視覺化</h1>

<div class="controls">
<button onclick="goBack()">⬅️ 返回</button>
<input id="numInput" type="number" placeholder="組數(預設8)" min="3" max="50">
<button onclick="generateArray()">產生數列</button>
<button onclick="startSort()">開始排序</button>
<button onclick="resetSort()">重置</button>
</div>

<div id="canvas"></div>

<div class="stats">
<div>比較：<span id="cmp">0</span></div>
<div>交換：<span id="swp">0</span></div>
<div>O(n log n)</div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");

let array=[],n=8;
let cmp=0,swp=0;
let isSorting=false;

function goBack(){
    if(confirm("確定返回？")) history.back();
}

function getN(){
    let v=parseInt(document.getElementById("numInput").value);
    return (isNaN(v)||v<3)?8:v;
}

function generateArray(){
    n=getN();
    array=[];
    for(let i=0;i<n;i++) array.push(Math.floor(Math.random()*300)+20);
    draw();
}

function draw(){
    canvas.innerHTML="";
    const w=(canvas.clientWidth-40)/n;

    array.forEach((v,i)=>{
        const bar=document.createElement("div");
        bar.className="bar";
        bar.style.left=(20+i*w+w*0.2)+"px";
        bar.style.width=w*0.6+"px";
        bar.style.height=(v/320)*380+"px";
        bar.textContent=v;
        canvas.appendChild(bar);
    });
}

function update(){
    document.getElementById("cmp").textContent=cmp;
    document.getElementById("swp").textContent=swp;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function quickSort(l,r){
    if(l>=r) return;

    let pivot=array[r];
    let i=l-1;

    for(let j=l;j<r;j++){
        cmp++;
        update();

        if(array[j]<pivot){
            i++;
            [array[i],array[j]]=[array[j],array[i]];
            swp++;
            draw();
            await sleep(150);
        }
    }

    [array[i+1],array[r]]=[array[r],array[i+1]];
    swp++;
    draw();
    await sleep(200);

    let p=i+1;

    await quickSort(l,p-1);
    await quickSort(p+1,r);
}

function startSort(){
    if(isSorting) return;
    isSorting=true;
    cmp=swp=0;
    update();
    quickSort(0,n-1).then(()=>isSorting=false);
}

function resetSort(){
    isSorting=false;
    cmp=swp=0;
    update();
    generateArray();
}

generateArray();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>合併排序法視覺化</title>

<style>
body{
    font-family:Microsoft JhengHei;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

button,input{
    padding:10px;
    border:none;
    border-radius:10px;
    font-weight:bold;
}

button{background:#2196F3;color:white;cursor:pointer;}

#canvas{
    height:420px;
    position:relative;
    background:#fafafa;
    border:2px solid #ccc;
    border-radius:15px;
    overflow:hidden;
    padding:0 20px;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    color:white;
    text-align:center;
    font-size:12px;
    border-radius:5px 5px 0 0;
    transition:0.3s;
}

.bar.active{background:orange;}
.bar.sorted{background:#4CAF50;}
.bar.done{background:#4CAF50 !important;}

/* 圖例 */
.legend{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:10px;
    font-size:14px;
}

.box{width:12px;height:12px;display:inline-block;margin-right:5px;}
.blue{background:#2196F3;}
.orange{background:orange;}
.green{background:#4CAF50;}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Merge Sort</h2>

<div class="controls">
<button onclick="goBack()">返回首頁</button>
<input id="num" type="number" placeholder="組數">
<button onclick="generate()">生成</button>
<button onclick="start()">開始</button>
<button onclick="pause()">暫停</button>
<button onclick="reset()">重置</button>
</div>

<div id="canvas"></div>

<div class="legend">
<div><span class="box blue"></span>未排序</div>
<div><span class="box orange"></span>比較</div>
<div><span class="box green"></span>完成</div>
</div>

<div class="stats">
比較:<span id="cmp">0</span>
交換:<span id="swp">0</span>
移動:<span id="mov">0</span>
O(n log n)/O(n)
</div>

</div>

<script>

let arr=[],n=8;
let cmp=0,swp=0,mov=0;
let pauseFlag=false;

function goBack(){window.history.back();}

function getN(){
let v=parseInt(document.getElementById("num").value);
return isNaN(v)?8:v;
}

function generate(){
n=getN();
arr=Array.from({length:n},()=>Math.floor(Math.random()*300)+20);
draw();
}

function draw(){
let c=document.getElementById("canvas");
c.innerHTML="";
let w=(c.clientWidth-40)/n;

arr.forEach((v,i)=>{
let b=document.createElement("div");
b.className="bar";
b.style.left=(20+i*w+w*0.2)+"px";
b.style.width=w*0.6+"px";
b.style.height=(v/320)*380+"px";
b.textContent=v;
c.appendChild(b);
});
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function update(){
document.getElementById("cmp").textContent=cmp;
document.getElementById("swp").textContent=swp;
document.getElementById("mov").textContent=mov;
}

async function merge(l,m,r){

let temp=[];
let i=l,j=m+1;
let bars=document.getElementsByClassName("bar");

while(i<=m && j<=r){

while(pauseFlag) await sleep(100);

cmp++; update();

bars[i].classList.add("active");
bars[j].classList.add("active");

await sleep(300);

if(arr[i]<arr[j]) temp.push(arr[i++]);
else temp.push(arr[j++]);
}

while(i<=m) temp.push(arr[i++]);
while(j<=r) temp.push(arr[j++]);

for(let k=l;k<=r;k++){
arr[k]=temp[k-l];
}

draw();
}

async function mergeSort(l,r){
if(l>=r) return;

let m=Math.floor((l+r)/2);
await mergeSort(l,m);
await mergeSort(m+1,r);
await merge(l,m,r);
}

async function start(){
cmp=swp=mov=0;update();
await mergeSort(0,n-1);

document.querySelectorAll(".bar").forEach(b=>{
b.className="bar done";
});
}

function pause(){pauseFlag=!pauseFlag;}

function reset(){
pauseFlag=false;
cmp=swp=mov=0;update();
generate();
}

generate();

</script>

</body>
</html>

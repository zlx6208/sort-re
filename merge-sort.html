<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合併排序法</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"Microsoft JhengHei";
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:25px;
}

h1{text-align:center;margin-bottom:10px;}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border:none;
    border-radius:10px;
    font-size:14px;
}

button{
    background:#2196F3;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#canvas{
    width:100%;
    height:400px;
    border:2px solid #ccc;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:#fafafa;
    padding:0 20px;
}

.bar{
    position:absolute;
    bottom:0;
    background:#2196F3;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-size:12px;
    border-radius:6px 6px 0 0;
    transition:all 0.3s ease;
}

.bar.comparing{background:orange;}
.bar.sortedAll{background:#4CAF50 !important;}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
    flex-wrap:wrap;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>合併排序法視覺化</h1>

<div class="controls">
<button onclick="goBack()">⬅️ 返回</button>
<input id="numInput" type="number" placeholder="組數(預設8)" min="3" max="50">
<button onclick="generateArray()">產生數列</button>
<button onclick="startSort()">開始排序</button>
<button onclick="resetSort()">重置</button>
</div>

<div id="canvas"></div>

<div class="stats">
<div>比較：<span id="cmp">0</span></div>
<div>移動：<span id="mov">0</span></div>
<div>O(n log n)</div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");

let array=[],n=8;
let cmp=0,mov=0;
let isSorting=false;

function goBack(){
    if(confirm("確定返回？")) history.back();
}

function getN(){
    let v=parseInt(document.getElementById("numInput").value);
    return (isNaN(v)||v<3)?8:v;
}

function generateArray(){
    n=getN();
    array=[];
    for(let i=0;i<n;i++) array.push(Math.floor(Math.random()*300)+20);
    draw();
}

function draw(){
    canvas.innerHTML="";
    const w=(canvas.clientWidth-40)/n;

    array.forEach((v,i)=>{
        const bar=document.createElement("div");
        bar.className="bar";
        bar.style.left=(20+i*w+w*0.2)+"px";
        bar.style.width=w*0.6+"px";
        bar.style.height=(v/320)*380+"px";
        bar.textContent=v;
        canvas.appendChild(bar);
    });
}

function update(){
    document.getElementById("cmp").textContent=cmp;
    document.getElementById("mov").textContent=mov;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function mergeSort(l,r){
    if(l>=r) return;

    let mid=Math.floor((l+r)/2);
    await mergeSort(l,mid);
    await mergeSort(mid+1,r);
    await merge(l,mid,r);
}

async function merge(l,mid,r){
    let left=array.slice(l,mid+1);
    let right=array.slice(mid+1,r+1);

    let i=0,j=0,k=l;

    while(i<left.length && j<right.length){
        cmp++;
        update();

        if(left[i]<right[j]){
            array[k]=left[i++];
        }else{
            array[k]=right[j++];
        }

        mov++;
        draw();
        await sleep(200);
        k++;
    }

    while(i<left.length){
        array[k++]=left[i++];
        mov++;
        draw();
        await sleep(100);
    }

    while(j<right.length){
        array[k++]=right[j++];
        mov++;
        draw();
        await sleep(100);
    }
}

function startSort(){
    if(isSorting) return;
    isSorting=true;
    cmp=mov=0;
    update();
    mergeSort(0,n-1).then(()=>isSorting=false);
}

function resetSort(){
    isSorting=false;
    cmp=mov=0;
    update();
    generateArray();
}

generateArray();

</script>

</body>
</html>
